    padding: 26px 20px 20px;
    position: relative;

    box-shadow: 0 20px 60px rgba(0,0,0,0.40);

  .card::before {

  .cta-btn {

  .cta-btn:hover { opacity: 0.93; transform: translateY(-1px); }
  .cta-btn:active { transform: translateY(0); opacity: 1; }
  .cta-btn svg { width: 15px; height: 15px; fill: #ffffff; }
  .cta-sub { text-align: center; font-size: 11px; color: #7A7A8E !important; letter-spacing: 0.03em; }

  /* ── FOOTER ── */
  .footer { margin-top: 30px; display: flex; gap: 14px; align-items: center; }
  .footer a { font-size: 12px; color: #6A6A7E !important; text-decoration: none; transition: color 0.2s; }
  .footer a:hover { color: #A0A0B8 !important; }
  .footer .sep { color: #3A3A4C !important; font-size: 12px; }

  @media (min-width: 600px) {

  }
</style>
